<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12306智能查询助手 - 小铁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 750px;
            height: 88vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .clear-btn {
            position: absolute;
            top: 18px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f7fa;
        }

        .message {
            margin-bottom: 18px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.7;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.assistant .message-bubble {
            background: white;
            border: 1px solid #e4e7ed;
            color: #303133;
            border-top-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-top-right-radius: 4px;
        }

        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e4e7ed;
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
            max-height: 120px;
        }

        #user-input:focus {
            border-color: #667eea;
        }

        #send-btn {
            padding: 0 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        #send-btn:hover {
            opacity: 0.9;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 滚动条美化 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #c0c4cc;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🚄 12306 智能查询助手 · 小铁</h1>
            <p>基于 MCP 协议 + 智谱AI 的车次查询智能体</p>
            <button class="clear-btn" onclick="clearChat()">清空对话</button>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message assistant">
                <div class="message-bubble">
你好呀！我是你的火车票查询助手小铁 🚄

我可以帮你：
• 查询任意城市间的火车车次和余票
• 查看出发到达时间、历时、票价信息

试试对我说：「帮我查北京到上海明天的火车票」
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <textarea id="user-input" placeholder="输入你的问题，按回车发送..." rows="1"></textarea>
            <button id="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('chat-messages');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // 自动调整输入框高度
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 回车发送
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(content, role) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `<div class="message-bubble">${content}</div>`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addLoading() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';
            msgDiv.id = 'loading-msg';
            msgDiv.innerHTML = '<div class="message-bubble"><span class="loading"></span>正在查询中，请稍候...</div>';
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeLoading() {
            const loading = document.getElementById('loading-msg');
            if (loading) loading.remove();
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // 添加用户消息
            addMessage(text, 'user');
            input.value = '';
            input.style.height = 'auto';
            
            // 禁用发送
            sendBtn.disabled = true;
            addLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                removeLoading();

                if (data.success) {
                    // 换行转HTML
                    const replyHtml = data.reply.replace(/\n/g, '<br>');
                    addMessage(replyHtml, 'assistant');
                } else {
                    addMessage('出错了：' + data.error, 'assistant');
                }
            } catch (e) {
                removeLoading();
                addMessage('网络错误，请稍后重试', 'assistant');
            }

            sendBtn.disabled = false;
            input.focus();
        }

        async function clearChat() {
            if (!confirm('确定要清空对话历史吗？')) return;
            
            try {
                await fetch('/api/clear', { method: 'POST' });
                messagesDiv.innerHTML = `
                    <div class="message assistant">
                        <div class="message-bubble">
对话已清空！有什么可以帮你的吗？😊
                        </div>
                    </div>
                `;
            } catch (e) {
                alert('清空失败');
            }
        }

        // 页面加载后聚焦输入框
        window.onload = function() {
            input.focus();
        };
    </script>
</body>
</html>
